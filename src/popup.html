<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat Saver</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; width: 360px; color: #202123; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
    h1 a, .links a { font-size: 12px; font-weight: 400; color: #10a37f; margin-left: 10px; }
    p { margin: 0 0 10px; color: #555; }
    .box { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    button { padding: 7px 12px; border: 0; border-radius: 8px; background: #10a37f; color: #fff; font: 600 13px system-ui; cursor: pointer; }
    button.secondary { background: #eee; color: #202123; }
    button:disabled { opacity: .5; cursor: default; }
    #filter { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; margin: 8px 0 6px; font: inherit; }
    #list { max-height: 240px; overflow: auto; border: 1px solid #eee; border-radius: 8px; }
    #list label { display: flex; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
    #list label:hover { background: #f7f7f8; }
    #list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .d { color: #888; font-size: 11px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .grow { flex: 1; }
    #msg { color: #b00020; margin-top: 8px; }
    #tests { margin: 8px 0 0; padding: 0; list-style: none; }
    #tests li { padding: 3px 0; }
    #tests .ok { color: #10a37f; } #tests .bad { color: #b00020; }
    #tests .detail { color: #666; font-size: 12px; display: block; margin-left: 18px; word-break: break-word; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Chat Saver <span><a href="#" id="library">Library</a><a href="#" id="settings">Settings</a></span></h1>

  <div class="box">
    <label><input type="checkbox" id="autoBackup"> <b>Back up automatically</b></label>
    <div id="backupLine" style="color:#666;font-size:12px;margin-top:4px"></div>
  </div>

  <div class="box" id="siteBox">
    <p id="siteText">Open ChatGPT or Claude in this tab to save chats from it.</p>
    <div id="siteActions" class="hidden">
      <div class="row"><button id="load">Save several chats…</button><button id="selftest" class="secondary">Run self-test</button></div>
      <div id="picker" class="hidden">
        <input id="filter" type="search" placeholder="Filter by title">
        <div id="list"></div>
        <div class="row">
          <label><input type="checkbox" id="all"> Select all shown</label>
          <span class="grow"></span>
          <button id="more" class="secondary">Load more</button>
        </div>
        <div class="row">
          <label class="grow"><input type="checkbox" id="summary"> AI summary for each</label>
          <button id="save" disabled>Save 0 chats</button>
        </div>
      </div>
      <div id="testBox" class="hidden">
        <ul id="tests"></ul>
        <div class="row"><span id="testSummary" class="grow"></span><button id="copyReport" class="secondary">Copy report</button></div>
      </div>
    </div>
  </div>
  <div id="msg"></div>
  <p class="links">Have ChatGPT's official data export? <a href="#" id="import">Import it</a></p>
  <script src="popup.js"></script>
</body>
</html>
